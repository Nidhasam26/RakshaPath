name: rakshapath
description: "RakshaPath Safe-Travel Android and Web Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  provider: ^6.1.1
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  flutter_riverpod: ^3.4.3
  connectivity_plus: ^7.3.2
  geolocator: ^14.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
